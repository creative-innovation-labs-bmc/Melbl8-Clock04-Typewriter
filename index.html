<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="theme-color" content="#373A36">
  <meta name="referrer" content="no-referrer">
  <title>Melbourne Typewriter Clock</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="bitter-font.css?v=20260804-enplug2">
  <link rel="stylesheet" href="single-line-colours.css?v=20260804-enplug2">
  <script>
    (() => {
      const nativeGet = URLSearchParams.prototype.get;
      const nativeHas = URLSearchParams.prototype.has;

      URLSearchParams.prototype.get = function get(name) {
        if (name === 'layout' && !nativeHas.call(this, 'layout')) return 'single';
        return nativeGet.call(this, name);
      };
    })();
  </script>
</head>
<body>
  <main id="viewport" aria-label="Melbourne natural-language clock">
    <section id="stage" aria-label="The current time in Melbourne">
      <div class="safe-area" aria-hidden="true"></div>

      <div id="messageFrame" class="message-frame">
        <div id="leadLine" class="message-line lead-line" aria-hidden="true">
          <span id="leadBeforeCursor"></span><span id="leadCursor" class="cursor" hidden></span><span id="leadAfterCursor"></span>
        </div>

        <div id="timeLine" class="message-line time-line" role="timer" aria-live="polite" aria-atomic="true">
          <span id="timeBeforeCursor"></span><span id="timeCursor" class="cursor" aria-hidden="true" hidden></span><span id="timeAfterCursor"></span>
        </div>

        <div id="singleLine" class="message-line single-line" role="timer" aria-live="polite" aria-atomic="true" hidden>
          <span id="singleBeforeCursor"></span><span id="singleCursor" class="cursor" aria-hidden="true" hidden></span><span id="singleAfterCursor"></span>
        </div>

        <div id="messageMeasure" class="message-line message-measure" aria-hidden="true"></div>
      </div>

      <footer class="footer-row">
        <div class="location-block">
          <span class="location">Melbourne</span>
          <span class="separator" aria-hidden="true">·</span>
          <span id="dateLabel" class="date-label"></span>
        </div>
        <div class="status-block">
          <span id="modeLabel" class="mode-label" hidden>Demo</span>
          <span id="statusLabel" class="status-label">Live</span>
        </div>
      </footer>

      <div class="progress-track" aria-hidden="true">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </section>

    <div id="rotatePrompt" class="rotate-prompt" hidden>
      <div class="rotate-icon" aria-hidden="true">↻</div>
      <p>Rotate your phone for the full gallery preview</p>
    </div>
  </main>

  <script type="module" src="single-line-controller.js?v=20260804-enplug2"></script>
  <script type="module" src="app.js?v=20260804-enplug2"></script>
</body>
</html>
