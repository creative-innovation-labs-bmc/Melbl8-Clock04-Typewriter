<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="theme-color" content="#373A36">
  <title>Melbourne Typewriter Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="viewport" aria-label="Melbourne natural-language clock">
    <section id="stage" aria-label="The current time in Melbourne">
      <div class="safe-area" aria-hidden="true"></div>

      <header class="heading-row">
        <p class="eyebrow">THE TIME NOW IS</p>
        <p id="modeLabel" class="mode-label" hidden>DEMO</p>
      </header>

      <div id="phraseFrame" class="phrase-frame">
        <div id="phrase" class="phrase" role="timer" aria-live="polite" aria-atomic="true">
          <span id="beforeCursor"></span><span id="cursor" class="cursor" aria-hidden="true"></span><span id="afterCursor"></span>
        </div>
        <div id="phraseMeasure" class="phrase phrase-measure" aria-hidden="true"></div>
      </div>

      <footer class="footer-row">
        <div class="location-block">
          <span class="location">MELBOURNE</span>
          <span class="separator" aria-hidden="true">·</span>
          <span id="dateLabel" class="date-label"></span>
        </div>
        <div id="statusLabel" class="status-label" aria-hidden="true">LIVE</div>
      </footer>

      <div class="progress-track" aria-hidden="true">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </section>

    <div id="rotatePrompt" class="rotate-prompt" hidden>
      <div class="rotate-icon" aria-hidden="true">↻</div>
      <p>Rotate your phone for the full gallery preview</p>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
