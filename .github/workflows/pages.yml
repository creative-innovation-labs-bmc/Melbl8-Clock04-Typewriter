name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site with Bitter Bold
        run: |
          mkdir -p _site/assets
          rsync -a --exclude '.git' --exclude '_site' --exclude 'font' ./ _site/
          base64 --decode font/Bitter-Bold.woff2.b64 > _site/assets/Bitter-Bold.woff2
          test -s _site/assets/Bitter-Bold.woff2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
